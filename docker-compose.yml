services:
  postgres:
    image: postgres:17
    container_name: assessment-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: assessment_engine
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: